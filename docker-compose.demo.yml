version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: range_and_react_demo
      POSTGRES_USER: range_and_react
      POSTGRES_PASSWORD: range_and_react
    ports:
      - "5432:5432"
    volumes:
      - vrt_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U range_and_react -d range_and_react_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      VRT_APP_ENV: demo
      VRT_FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      VRT_DATABASE_URL: postgresql://range_and_react:range_and_react@postgres:5432/range_and_react_demo
      VRT_DEMO_MODE_ENABLED: "true"
      VRT_DEMO_PUBLIC_CREDENTIALS: "true"
      VRT_DEMO_ORG_NAME: Coaching Demo Workspace
      VRT_DEMO_OWNER_EMAIL: owner@demo.local
      VRT_DEMO_COACH_EMAIL: coach@demo.local
      VRT_DEMO_MEMBER_EMAIL: member@demo.local
      VRT_DEMO_SEED_PASSWORD: DemoPass123!
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  vrt_demo_postgres_data:
